name: Publish Inference Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docker/Dockerfile.inference
      - docker/requirements.inference.txt
      - docker/requirements.inference.extra
      - scripts/**/*
      - noksr/**/*
      - docs/docker_inference.md
      - .github/workflows/publish-inference-image.yml

env:
  IMAGE_NAME: noksr-inference

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.inference
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
